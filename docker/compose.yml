# MongoDB de développement pour Payload CMS.
#   démarrer : docker compose -f docker/compose.yml up -d
#   arrêter  : docker compose -f docker/compose.yml down
#
# Mongo tourne en replica set mono-nœud : Payload utilise des transactions,
# qui ne sont pas disponibles sur une instance standalone.
services:
  mongo:
    image: mongo:7
    container_name: hgc-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

volumes:
  mongo-data:
